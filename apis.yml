- aid: se-ranking:se-ranking-website-audit-api
  name: SE Ranking Website Audit API
  description: "This collection of endpoints provides a comprehensive suite of tools to programmatically\
    \ manage the full lifecycle of your technical SEO audits. These requests allow you to launch new crawls,\
    \ monitor their progress in real-time, and retrieve detailed reports and page-level data for in-depth\
    \ analysis.\n\n**Note on Costs:** Audits are billed on a per-page basis.\n\n- **Standard Audits:**\
    \ 2 credits per crawled page.\n    \n- **Advanced Audits (with JavaScript rendering):** 20 credits\
    \ per crawled page.\n    \n\n### 1\\. Create & Manage Audits\n\nUse these endpoints to start new crawls,\
    \ re-run previous ones, or manage your list of audits.\n\n- **Create Audits**: Launch a new **Standard**\
    \ (HTML crawl) or **Advanced** (JavaScript rendering) audit with highly customizable settings.\n \
    \   \n- **List Audits**: Retrieve a paginated list of all audits associated with your account.\n \
    \   \n- **Update Audit Title**: Change the display title of an existing audit report.\n    \n- **Delete\
    \ Audit**: Permanently remove an audit and all of its associated data.\n    \n- **Recheck Audit**:\
    \ Initiate a new crawl for a completed audit using its original settings.\n    \n\n### 2\\. Monitor\
    \ & Retrieve Data\n\nOnce an audit is running or complete, use these endpoints to check its progress\
    \ and pull detailed results.\n\n- **Get Audit Status**: Check the real-time progress of an ongoing\
    \ audit.\n    \n- **Get Audit Report**: Fetch the full, high-level report for a completed audit, including\
    \ the overall health score and a summary of issues.\n    \n- **Get Audit History**: Retrieve a historical\
    \ snapshot of a specific audit run from a particular date.\n    \n- **Get All Crawled Pages**: Return\
    \ a complete, paginated list of every URL discovered during an audit.\n    \n- **Get Audit Pages by\
    \ Issue**: Get a list of all URLs affected by a single, specific issue.\n    \n- **Get All Issues\
    \ for a Specific URL**: Retrieve all errors, warnings, and notices found on a single page.\n    \n\
    - **Get All Found Links**: Fetch a complete list of every internal and external link discovered across\
    \ the entire site during the audit."
  humanURL: https://seranking.com/api/data/reference/
  baseURL: https://api.seranking.com
  tags:
  - Website Audit
  properties:
  - type: OpenAPI
    url: openapi/se-ranking-website-audit-api-openapi.yml
  - type: Overlay
    url: overlays/se-ranking-website-audit-api-overlay.yaml
- aid: se-ranking:mcp-server
  name: SE Ranking MCP Server
  description: >-
    Hosted remote Model Context Protocol server exposing 217 tools and 5 prompts across three SE Ranking surfaces:
    the credit-billed Data API (66 DATA_* tools, backed 1:1 by the published OpenAPI), the Project API (127 PROJECT_*
    tools for projects, keywords, competitors, audits, AI Results Tracker prompts and sub-accounts) and SE Visible
    (24 SEV_* tools for LLM/AI-search visibility). Streamable HTTP transport with OAuth 2.1 + PKCE and dynamic client
    registration, or an X-Api-Key header for headless use. tools/list and prompts/list answer anonymously; tools/call
    requires a token. For the Project API and SE Visible this MCP manifest is the only machine-readable contract
    SE Ranking publishes — neither has an OpenAPI.
  humanURL: https://seranking.com/api/mcp/
  baseURL: https://api.seranking.com/mcp
  tags:
  - MCP
