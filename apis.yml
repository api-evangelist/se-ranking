  - type: OpenAPI
    url: openapi/se-ranking-backlinks-api-openapi.yml
- aid: se-ranking:se-ranking-domain-analysis-api
  name: SE Ranking Domain Analysis API
  description: "This collection of endpoints allows you to perform in-depth competitive analysis on any\
    \ domain. Use these requests to uncover keyword strategies, traffic trends, and competitor performance\
    \ in both organic and paid search.\n\n### Performance Overviews\n\nGet high-level statistics about\
    \ a domain's search performance.\n\n- **Regional database**: Get detailed organic and paid stats for\
    \ a domain within a single, selected regional database.\n    \n- **Worldwide aggregate**: Aggregate\
    \ a domain's global search performance metrics for the current month.\n    \n- **History trends**:\
    \ Track historical trends for keywords, traffic, and cost for organic or paid search within a specific\
    \ region.\n    \n\n### Keyword Analysis\n\nDive deep into the specific keywords a domain ranks for.\n\
    \n- **Domain keywords**: Fetch a filterable and sortable list of all organic or paid keywords for\
    \ a domain.\n    \n- **Domain keywords comparison**: Compare two domains to find common keywords (overlap)\
    \ or identify keyword gaps.\n    \n\n### Competitor & Ad Analysis\n\nAnalyze the competitive landscape\
    \ and paid advertising strategies.\n\n- **Competitors**: Discover a domain's top organic or paid competitors\
    \ and see the number of keywords you have in common.\n    \n- **Paid ads**: Analyze paid ads either\
    \ by keyword (to see who is bidding) or by domain (to see what a specific domain is bidding on)."
  humanURL: https://seranking.com/api/data/reference/
  baseURL: https://api.seranking.com
  tags:
  - Domain Analysis
  properties:
  - type: OpenAPI
    url: openapi/se-ranking-domain-analysis-api-openapi.yml
  - type: Overlay
    url: overlays/se-ranking-domain-analysis-api-overlay.yaml
- aid: se-ranking:se-ranking-keyword-research-api
  name: SE Ranking Keyword Research API
  description: "This collection of endpoints is designed for comprehensive keyword analysis and discovery.\
    \ Use these requests to retrieve performance metrics for large lists of keywords or to generate new\
    \ keyword ideas based on a seed term.\n\nThis folder is divided into two main categories:\n\n### Bulk\
    \ Keyword Metrics\n\n- **Export Keywords Metrics**: Submit a list of up to 5,000 keywords to get detailed\
    \ data points for each, including search volume, CPC, competition score, keyword difficulty, and historical\
    \ search volume trends. This is ideal for bulk analysis and data enrichment.\n    \n\n### Keyword\
    \ Discovery\n\nUse these endpoints to expand your keyword lists and uncover new ranking opportunities.\n\
    \n- **Get Similar Keywords**: Find keywords that are semantically similar to your seed keyword, including\
    \ synonyms and close variations.\n    \n- **Get Related Keywords**: Discover keywords that are topically\
    \ related, based on having a high number of overlapping URLs in their search results.\n    \n- **Get\
    \ Question Keywords**: Generate a list of keywords phrased as common user questions, perfect for content\
    \ marketing and FAQ creation.\n    \n- **Get Longtail Keywords**: Find longer, more specific keyword\
    \ phrases that often have lower competition and higher conversion rates."
  humanURL: https://seranking.com/api/data/reference/
  baseURL: https://api.seranking.com
  tags:
  - Keyword Research
  properties:
  - type: OpenAPI
    url: openapi/se-ranking-keyword-research-api-openapi.yml
  - type: Overlay
    url: overlays/se-ranking-keyword-research-api-overlay.yaml
