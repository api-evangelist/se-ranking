- aid: se-ranking:se-ranking-backlinks-api
  name: SE Ranking backlinks API
  description: "# Backlinks API\n\nThis collection of requests allows you to conduct a comprehensive analysis\
    \ of the backlink profile for any given target, whether it's a root domain, a specific host (subdomain),\
    \ or a particular URL.\n\nYou can use these endpoints to retrieve high-level statistics, fetch detailed\
    \ backlink lists, analyze historical trends, and check authority scores.\n\n### Summary & Core Metrics\n\
    \nUse these endpoints to get a quick overview of a target's backlink profile. These requests support\
    \ batching for up to 100 targets.\n\n- **`summary`**: Returns extended statistics, including the number\
    \ of referring domains, IPs, top anchors, TLDs, and more.\n    \n- **`metrics`**: Retrieves a set\
    \ of key metrics, such as the total number of backlinks, referring domains, and dofollow/nofollow\
    \ link counts.\n    \n- **`count`**: Provides a simple count of the total number of live backlinks\
    \ for a target.\n    \n\n### Detailed Backlink Retrieval\n\nUse these endpoints to get lists of the\
    \ actual backlinks pointing to a target.\n\n- **`all`**: Fetches a detailed list of backlinks with\
    \ powerful filtering and sorting options. This is ideal for getting the \"top\" backlinks based on\
    \ criteria like InLink Rank.\n    \n- **`raw`**: Retrieves a complete, unfiltered list of all backlinks\
    \ using efficient cursor-based pagination. This is best for fetching an entire dataset in batches.\n\
    \    \n- **`export`**: Exports all backlinks for a target into a downloadable `.csv.gz` file. This\
    \ process is asynchronous and designed for very large-scale data retrieval.\n    \n\n### Historical\
    \ Data & Trends\n\nTrack changes in a backlink profile over time.\n\n- **`history`**: Get a list of\
    \ new and lost backlinks within a specified date range.\n    \n- **`history/count`**: Returns the\
    \ number of new or lost backlinks for each day in a given period.\n    \n- **`history/cumulative`**:\
    \ Provides the total number of live backlinks for each day in a given period.\n    \n\n### Analyze\
    \ Specific Backlink Aspects\n\nDive deeper into specific components of the backlink profile.\n\n-\
    \ **`anchors`**: Returns information about the anchor texts used in links pointing to a target.\n\
    \    \n- **`refdomains`**: Provides details on the unique referring domains, including their authority\
    \ and the number of links from each.\n    \n- **`referring-ips`** **&** **`subnets`**: Analyzes the\
    \ network distribution of backlinks by IP address and C-class subnets.\n    \n- **`indexed-pages`**:\
    \ Lists the pages on the target site that have received one or more backlinks.\n    \n\n### Authority\
    \ Scores\n\nCheck the calculated authority of a target based on its backlink profile.\n\n- **`authority`**:\
    \ Retrieves both the InLink Rank (Page Authority) and Domain InLink Rank (Domain Authority).\n   \
    \ \n- **`authority/domain`**: Focuses specifically on Domain Authority, including its distribution\
    \ and historical values.\n    \n- **`authority/page`**: Focuses specifically on Page Authority and\
    \ its historical values."
  humanURL: https://seranking.com/api/data/reference/
  baseURL: https://api.seranking.com
  tags:
  - backlinks
