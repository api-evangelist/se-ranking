    Bearer token. A second, OAuth-gated MCP route is advertised at https://seranking.com/wp-json/seranking-mcp-oauth/v1/mcp (401 + WWW-Authenticate:
    Bearer resource_metadata=...); the documented client endpoint is https://api.seranking.com/mcp.'
install:
  claude_code: claude mcp add --transport http se-ranking https://api.seranking.com/mcp
  claude_desktop: 'Settings > Connectors > Add custom connector > Remote MCP server URL: https://api.seranking.com/mcp'
  cursor: '.cursor/mcp.json: {"mcpServers":{"se-ranking":{"url":"https://api.seranking.com/mcp"}}}'
  mcp_remote_bridge: npx -y mcp-remote https://api.seranking.com/mcp
  source: https://seranking.com/api/mcp/
  note: mcp-remote is a generic third-party stdio<->http bridge, not an SE Ranking package. SE Ranking ships NO first-party stdio server,
