openapi: 3.2.0
info:
  title: SE Ranking Data Backlinks API
  description: SEO data API for keywords, domains, backlinks, AI Search, SERP, and site audit.
  version: 1.0.0
  contact:
    name: SE Ranking API Support
    url: https://seranking.com/api
servers:
- url: https://api.seranking.com
  description: Production
security:
- apikeyAuth: []
tags:
- name: Backlinks
  description: '# Backlinks API


    This collection of requests allows you to conduct a comprehensive analysis of the backlink profile for any given target, whether it''s a root domain, a specific host (subdomain), or a particular URL.'
paths:
  /v1/backlinks/summary:
    get:
      operationId: getBacklinksSummary
      tags:
      - Backlinks
      summary: summary
      description: Retrieves a comprehensive summary of backlink statistics for one or more targets.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
          description: Supports multiple targets by repeating this parameter.
        example: rubyonrails.org
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - domain
          - host
          - url
          default: host
        example: host
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksSummary
      tags:
      - Backlinks
      summary: summary
      description: Retrieves a comprehensive summary of backlink statistics for one or more targets.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target:
                - https://www.seranking.com/
                - https://www.google.com/
                mode: host
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/metrics:
    get:
      operationId: getBacklinksMetrics
      tags:
      - Backlinks
      summary: metrics
      description: Retrieves key backlink statistics (e.g., backlink, referring domain, and IP counts) for one or more targets.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: target-rfunqmac.com
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - domain
          - host
          - url
          default: host
        example: domain
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksMetrics
      tags:
      - Backlinks
      summary: metrics
      description: Retrieves key backlink statistics (e.g., backlink, referring domain, and IP counts) for one or more targets.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target:
                - https://www.seranking.com/
                - https://www.seranking.com/
                mode: url
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/all:
    get:
      operationId: getBacklinksAll
      tags:
      - Backlinks
      summary: all
      description: Retrieves a detailed, filterable, and sortable list of backlinks pointing to a single target.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: http://accordconsultants.in/
      - name: mode
        in: query
        schema:
          type: string
        example: url
      - name: output
        in: query
        schema:
          type: string
        example: json
      - name: limit
        in: query
        schema:
          type: integer
        example: 10000
      - name: per_domain
        in: query
        schema:
          type: integer
        example: 1
      - name: order_by
        in: query
        schema:
          type: string
        example: inlink_rank
      - name: url_from_filter
        in: query
        schema:
          type: string
        example: unsam.edu.ar
      - name: url_to_filter
        in: query
        schema:
          type: string
        example: .jpg
      - name: url_to_filter_mode
        in: query
        schema:
          type: string
          enum:
          - contains
          - does_not_contain
        example: does_not_contain
      - name: url_from_filter_mode
        in: query
        schema:
          type: string
          enum:
          - contains
          - does_not_contain
          default: contains
        example: contains
      - name: anchor_filter
        in: query
        description: Filter by anchor text. Max 2063 characters.
        schema:
          type: string
          maxLength: 2063
      - name: anchor_filter_mode
        in: query
        schema:
          type: string
          enum:
          - contains
          - does_not_contain
          default: contains
        example: contains
      - name: nofollow_filter
        in: query
        schema:
          type: string
          enum:
          - nofollow_only
          - dofollow_only
      - name: inlink_rank_from
        in: query
        description: Minimum InLink Rank (0-100).
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: inlink_rank_to
        in: query
        description: Maximum InLink Rank (0-100).
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: domain_inlink_rank_from
        in: query
        description: Minimum Domain InLink Rank (0-100).
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: domain_inlink_rank_to
        in: query
        description: Maximum Domain InLink Rank (0-100).
        schema:
          type: integer
          minimum: 0
          maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksAll
      tags:
      - Backlinks
      summary: all
      description: Retrieves a detailed, filterable, and sortable list of backlinks pointing to a single target.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target: https://www.seranking.com/
                mode: domain
                limit: 10
                per_domain: 1
                order_by: date_found
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/raw:
    get:
      operationId: getBacklinksRaw
      tags:
      - Backlinks
      summary: raw
      description: Fetches the complete list of backlinks for a target in batches using cursor-based pagination.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: teilon.com
      - name: mode
        in: query
        schema:
          type: string
        example: host
      - name: limit
        in: query
        schema:
          type: integer
        example: 100
      - name: next
        in: query
        schema:
          type: string
        example: Pju9uZR4A2dylhvnUQ1UAu1NWfBjWoutYn_z2MHcVcZqH2eGVtT6Z6j2DjgyJKqyLem4yIj_it6xfHqasMXnj7/_zbLyBX93MmSekLiLxHa_gA9MRIrnPC2sxL4mDNzCzAsbK54U4UCScqvMexsrDx2obPcxHWZMl_yU7hQDa/9GJwcutpU0_v7TbtefRP9EVw/5eFZjvsNERYxl8jORIyNxL4N5t5LK75BaM51pYQ5q8bfuw/F42rIB8xKM0vD0i090_65JHrZPsDoAkKce/XELUwhGcoDqyRgG2P3AXAbZOe5RDFV/vz0YFTyI9tqynHJtP2olEKQ079f3hwroR6YML5AgTsVPwIynxNILAd_OHU5aFTReKIy686fBoIFZWR2dsyeGgN3r/n0jolcHNg==
      - name: output
        in: query
        schema:
          type: string
        example: json
      - name: per_domain
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 1
      - name: order_by
        in: query
        schema:
          type: string
          enum:
          - date_found
          - domain_inlink_rank
          - inlink_rank
          default: date_found
        example: date_found
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/count:
    get:
      operationId: getBacklinksCount
      tags:
      - Backlinks
      summary: count
      description: Returns the total number of live backlinks for one or more targets.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
          description: Supports multiple targets by repeating this parameter.
        example: anandaioga.com
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - domain
          - host
          - url
          default: host
        example: url
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksCount
      tags:
      - Backlinks
      summary: count
      description: Returns the total number of live backlinks for one or more targets.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target:
                - https://www.seranking.com/
                - https://www.google.com/
                mode: host
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/export:
    get:
      operationId: getBacklinksExport
      tags:
      - Backlinks
      summary: export
      description: Initiates an asynchronous task to export all backlinks for a target to a downloadable CSV file.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: https://seranking.com
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - domain
          - host
          - url
          default: host
        example: domain
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/export/status:
    get:
      operationId: getBacklinksExportStatus
      tags:
      - Backlinks
      summary: export/status
      description: Status of the asynchronous task to export all backlinks for a target to a downloadable CSV file.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: task_id
        in: query
        required: true
        schema:
          type: string
        example: '1_878619'
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/history:
    get:
      operationId: getBacklinksHistory
      tags:
      - Backlinks
      summary: history
      description: Returns a list of new or lost backlinks for a single target within a specified date range.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: https://www.seranking.com
      - name: mode
        in: query
        schema:
          type: string
        example: domain
      - name: new_lost_type
        in: query
        schema:
          type: string
          enum:
          - new
          - lost
        example: new
      - name: date_from
        in: query
        schema:
          type: string
        example: '2024-01-14'
      - name: date_to
        in: query
        schema:
          type: string
        example: '2025-08-28'
      - name: link_type
        in: query
        schema:
          type: string
          enum:
          - href
          - redirect
        example: href
      - name: anchor_type
        in: query
        schema:
          type: string
          enum:
          - text
          - image
          - undefined
        example: text
      - name: dofollow
        in: query
        schema:
          type: string
          enum:
          - dofollow
          - nofollow
          - undefined
        example: dofollow
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      - name: url_from
        in: query
        description: Filter by referring page URL.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        example: 100
      - name: order_by
        in: query
        schema:
          type: string
          enum:
          - new_lost_date
          - domain_inlink_rank
          - inlink_rank
          default: new_lost_date
        example: new_lost_date
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksHistory
      tags:
      - Backlinks
      summary: history
      description: Returns a list of new or lost backlinks for a single target within a specified date range.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target: https://www.seranking.com
                mode: domain
                date_from: '2025-09-15'
                date_to: '2025-10-01'
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/history/count:
    get:
      operationId: getBacklinksHistoryCount
      tags:
      - Backlinks
      summary: history/count
      description: Returns the daily count of new and lost backlinks for a target over a specified period.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: https://www.seranking.com
      - name: mode
        in: query
        schema:
          type: string
        example: domain
      - name: new_lost_type
        in: query
        schema:
          type: string
        example: new
      - name: date_from
        in: query
        schema:
          type: string
        example: '2025-09-14'
      - name: date_to
        in: query
        schema:
          type: string
        example: '2025-10-28'
      - name: link_type
        in: query
        schema:
          type: string
        example: href
      - name: anchor_type
        in: query
        schema:
          type: string
        example: text
      - name: dofollow
        in: query
        schema:
          type: string
        example: dofollow
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      - name: url_from
        in: query
        description: Filter by referring page URL.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksHistoryCount
      tags:
      - Backlinks
      summary: history/count
      description: Returns the daily count of new and lost backlinks for a target over a specified period.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target: https://www.seranking.com
                mode: domain
                date_from: '2025-09-15'
                date_to: '2025-10-15'
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/history/cumulative:
    get:
      operationId: getBacklinksHistoryCumulative
      tags:
      - Backlinks
      summary: history/cumulative
      description: Returns the total number of live backlinks for a target for each day in a specified date range.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: https://www.seranking.com
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - domain
          - host
          - url
          default: host
        example: domain
      - name: date_from
        in: query
        schema:
          type: string
        example: '2024-01-14'
      - name: date_to
        in: query
        schema:
          type: string
        example: '2024-08-28'
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksHistoryCumulative
      tags:
      - Backlinks
      summary: history/cumulative
      description: Returns the total number of live backlinks for a target for each day in a specified date range.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target: https://www.seranking.com
                mode: domain
                date_from: '2024-01-14'
                date_to: '2024-08-28'
                output: json
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/anchors:
    get:
      operationId: getBacklinksAnchors
      tags:
      - Backlinks
      summary: anchors
      description: Returns information about the anchor texts used in backlinks that point to a single target.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: https://seranking.com
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - domain
          - host
          - url
          default: host
        example: domain
      - name: order_by
        in: query
        schema:
          type: string
          enum:
          - backlinks
          - refdomains
        example: backlinks
      - name: limit
        in: query
        schema:
          type: integer
        example: 2
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksAnchors
      tags:
      - Backlinks
      summary: anchors
      description: Returns information about the anchor texts used in backlinks that point to a single target.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target: https://www.seranking.com/
                order_by: backlinks
                mode: domain
                limit: 2
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/refdomains:
    get:
      operationId: getBacklinksRefdomains
      tags:
      - Backlinks
      summary: refdomains
      description: Retrieves a list of referring domains pointing to a single target, with sorting options.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
        example: https://seranking.com
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - domain
          - host
          - url
          default: host
        example: domain
      - name: order_by
        in: query
        schema:
          type: string
          enum:
          - date_found
          - domain_inlink_rank
          - inlink_rank
          default: date_found
        example: date_found
      - name: limit
        in: query
        schema:
          type: integer
        example: 10
      - name: output
        in: query
        schema:
          type: string
          enum:
          - json
          - xml
          default: json
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksRefdomains
      tags:
      - Backlinks
      summary: refdomains
      description: Retrieves a list of referring domains pointing to a single target, with sorting options.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target: https://www.seranking.com/
                order_by: date_found
                mode: domain
                limit: 2
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1/backlinks/refdomains/count:
    get:
      operationId: getBacklinksRefdomainsCount
      tags:
      - Backlinks
      summary: refdomains/count
      description: Returns the total number of unique referring domains for one or more targets.
      parameters:
      - name: apikey
        in: query
        schema:
          type: string
        example: '{{secret_key_data}}'
      - name: target
        in: query
        schema:
          type: string
          description: Supports multiple targets by repeating this parameter.
        example: https://seranking.com
      - name: mode
        in: query
        schema:
          type: string
        example: domain
      - name: output
        in: query
        schema:
          type: string
        example: json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      operationId: createBacklinksRefdomainsCount
      tags:
      - Backlinks
      summary: refdomains/count
      description: Returns the total number of unique referring domains for one or more targets.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                target:
                - https://www.seranking.com/
                - https://www.anandaioga.com/
                order_by: date_found
                mode: domain
                limit: 2
      parameters:
      - name: apikey
        in: query
